[workspace]
resolver = "2"
members = ["crates/forge-core", "crates/forge-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Brandon Johnson"]

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
clap = { version = ">=4.5, <4.5.40", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console = "0.15"
dialoguer = "0.10"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
